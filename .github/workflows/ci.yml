name: CI

# Comprueba que el backend compila y que el frontend pasa el tipado y el build.
# No despliega nada: el despliegue es manual (deploy-azure.yml esta desactivado).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (cargo check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend-Rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Backend-Rust
      - run: cargo check --locked --all-targets

  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run build
