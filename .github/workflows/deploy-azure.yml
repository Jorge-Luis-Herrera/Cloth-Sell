name: Build and deploy to Azure (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_LOGIN_SERVER: jennycloth20261014.azurecr.io
  IMAGE_NAME: jenny-clothing
  RESOURCE_GROUP: rg-jenny
  WEB_APP: jenny-clothing-20261014

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure and deploy App Service
        uses: azure/cli@v2
        env:
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          AUTH_SIGNING_KEY: ${{ secrets.AUTH_SIGNING_KEY }}
        with:
          inlineScript: |
            az webapp config appsettings set \
              --name "$WEB_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --settings \
                ADMIN_PASSWORD_HASH="$ADMIN_PASSWORD_HASH" \
                AUTH_SIGNING_KEY="$AUTH_SIGNING_KEY" \
                WEBSITES_PORT=8080 \
                DATABASE_URL="sqlite:///app/data/jenny.db?mode=rwc" \
                UPLOADS_DIR=/app/uploads \
              --output none
            az webapp config set \
              --name "$WEB_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --linux-fx-version "DOCKER|$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}" \
              --generic-configurations '{"healthCheckPath":"/api/health"}' \
              --output none
            az webapp restart --name "$WEB_APP" --resource-group "$RESOURCE_GROUP" --output none
            az webapp config container show --name "$WEB_APP" --resource-group "$RESOURCE_GROUP"
